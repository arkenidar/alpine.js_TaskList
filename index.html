<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alpine.js TaskList</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="css/alpine.css">
</head>

<body>
  <div x-data="taskListApp()">
    <!-- Header -->
    <h1>TaskList App (Alpine.js)</h1>
    <p style="text-align: center; margin-bottom: 15px; color: #666;">
      <small>
        Compare:
        <a href="jquery.html" style="color: #4A90E2;">jQuery Slim</a> |
        <a href="vanilla-js.html" style="color: #4A90E2;">Vanilla JS</a> |
        <a href="README.md" style="color: #4A90E2;">Docs</a>
      </small>
    </p>

    <!-- Add Task Section -->
    <div class="add-task">
      <input type="text" x-model="newTaskText" @keydown.enter="addTask()" placeholder="Add a new task...">
      <button @click="addTask()">Add</button>
    </div>

    <!-- Filter Buttons -->
    <div class="filter-buttons">
      <button @click="filter = 'all'" :class="{ 'view-selected': filter === 'all' }">
        All
      </button>
      <button @click="filter = 'todo'" :class="{ 'view-selected': filter === 'todo' }">
        To Do
      </button>
      <button @click="filter = 'done'" :class="{ 'view-selected': filter === 'done' }">
        Done
      </button>
    </div>

    <!-- Task List -->
    <ul class="task-list">
      <template x-for="task in filteredTasks" :key="task.id">
        <li class="task-item">
          <!-- Checkbox -->
          <input type="checkbox" x-model="task.completed">

          <!-- View Mode -->
          <span x-show="!task.editing" @click="startEdit(task.id)" x-text="task.text"
            :class="{ 'completed': task.completed }" class="task-text">
          </span>

          <!-- Edit Mode -->
          <input x-show="task.editing" x-model="task.text" @keydown.enter="saveEdit(task.id)"
            @keydown.escape="cancelEdit(task.id)" @blur="saveEdit(task.id)" x-ref="'input-' + task.id"
            class="task-edit-input" type="text">

          <!-- Delete Button -->
          <button @click="deleteTask(task.id)" class="delete-btn">
            Delete
          </button>
        </li>
      </template>

      <!-- Empty State -->
      <li x-show="filteredTasks.length === 0" class="empty-state">
        No tasks to show
      </li>
    </ul>
  </div>

  <script>
    function taskListApp() {
      return {
        tasks: [
          { id: 1, text: 'Learn Alpine.js basics', completed: false, editing: false },
          { id: 2, text: 'Build a tasklist app', completed: true, editing: false },
          { id: 3, text: 'Deploy to production', completed: false, editing: false }
        ],
        filter: 'all',
        nextId: 4,
        newTaskText: '',

        // Add new task
        addTask() {
          if (this.newTaskText.trim()) {
            this.tasks.push({
              id: this.nextId++,
              text: this.newTaskText.trim(),
              completed: false,
              editing: false
            });
            this.newTaskText = '';
          }
        },

        // Delete task
        deleteTask(id) {
          this.tasks = this.tasks.filter(t => t.id !== id);
        },

        // Start editing task
        startEdit(id) {
          const task = this.tasks.find(t => t.id === id);
          if (task) {
            // Store original text for cancel functionality
            task.originalText = task.text;
            task.editing = true;

            // Focus input on next tick
            this.$nextTick(() => {
              const input = this.$refs['input-' + id];
              if (input) {
                input.focus();
                input.select();
              }
            });
          }
        },

        // Save edit
        saveEdit(id) {
          const task = this.tasks.find(t => t.id === id);
          if (task) {
            // Prevent empty tasks
            if (!task.text.trim()) {
              task.text = task.originalText || 'Untitled task';
            }
            task.editing = false;
            delete task.originalText;
          }
        },

        // Cancel edit
        cancelEdit(id) {
          const task = this.tasks.find(t => t.id === id);
          if (task && task.originalText !== undefined) {
            task.text = task.originalText;
            task.editing = false;
            delete task.originalText;
          }
        },

        // Computed filtered tasks
        get filteredTasks() {
          if (this.filter === 'todo') {
            return this.tasks.filter(t => !t.completed);
          }
          if (this.filter === 'done') {
            return this.tasks.filter(t => t.completed);
          }
          return this.tasks;
        }
      }
    }
  </script>

  <script src="show-source.js"></script>
</body>

</html>
